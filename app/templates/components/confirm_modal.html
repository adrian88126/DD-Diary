<div id="confirm-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 class="mb-3">Confirm Deletion</h3>
    <p class="mb-4 text-muted">Are you sure you want to delete this item? This action cannot be undone.</p>
    <div class="flex justify-between gap-3">
      <button type="button" id="cancel-btn" class="btn btn-outline" style="flex: 1;">Cancel</button>
      <button type="button" id="confirm-btn" class="btn btn-danger" style="flex: 1;">Delete</button>
    </div>
  </div>
</div>
